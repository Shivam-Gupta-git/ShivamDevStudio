<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shivamdev-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.8" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Badge -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#shivamdev-grad)" filter="url(#subtle-shadow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="9" y="9" width="110" height="110" rx="29" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Stylized Monogram S / Code Emblems -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < -->
    <path d="M42 44 L30 64 L42 84" stroke-width="7.5" stroke="rgba(255,255,255,0.9)" />
    
    <!-- Right Bracket > -->
    <path d="M86 44 L98 64 L86 84" stroke-width="7.5" stroke="rgba(255,255,255,0.9)" />
    
    <!-- Central Flowing S-Curve -->
    <path d="M72 48 C62 42, 50 46, 50 56 C50 67, 78 61, 78 72 C78 82, 66 86, 56 80" stroke="#FFFFFF" stroke-width="8.5" />
  </g>
  
  <!-- Sparkle Accent Dot -->
  <circle cx="82" cy="40" r="3.5" fill="#FDE047" />
</svg>